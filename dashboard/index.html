<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binnacle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#EFF3F3; --surface:#FFFFFF; --surface-alt:#E4EAEA;
    --border:#C9D2D2; --border-strong:#A9B8B8;
    --ink:#10242C; --ink-secondary:#46606A; --ink-muted:#7C9096;
    --accent:#8B6A2E; --accent-ink:#FFFFFF; --accent-soft:#F1E6D2;
    --status-good:#2E7D5E; --status-good-soft:#DCEEE6;
    --status-warning:#C1671F; --status-warning-soft:#F5E4D3;
    --status-critical:#B4342E; --status-critical-soft:#F6DEDB;
    --status-info:#2F6E8C; --status-info-soft:#DCE9EE;
    --status-neutral:#6B7C82; --status-neutral-soft:#E6EAEB;
    --stage-contract:#6B5CA5; --stage-contract-soft:#EAE5F5;
    --font-display:'Fraunces',Georgia,serif;
    --font-body:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    --radius-sm:6px; --radius-md:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B1B24; --surface:#122733; --surface-alt:#1A323F;
      --border:#24424F; --border-strong:#315A69;
      --ink:#E8EEF0; --ink-secondary:#A9BAC0; --ink-muted:#708289;
      --accent:#D4AF5A; --accent-ink:#0B1B24; --accent-soft:#3A3220;
      --status-good:#4FAE84; --status-good-soft:#16352C;
      --status-warning:#E08A3E; --status-warning-soft:#3A2A18;
      --status-critical:#E2635C; --status-critical-soft:#3A1E1C;
      --status-info:#5FA8C9; --status-info-soft:#17303A;
      --status-neutral:#8CA0A6; --status-neutral-soft:#1E2C30;
      --stage-contract:#B9A6E8; --stage-contract-soft:#2A2340;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B1B24; --surface:#122733; --surface-alt:#1A323F;
    --border:#24424F; --border-strong:#315A69;
    --ink:#E8EEF0; --ink-secondary:#A9BAC0; --ink-muted:#708289;
    --accent:#D4AF5A; --accent-ink:#0B1B24; --accent-soft:#3A3220;
    --status-good:#4FAE84; --status-good-soft:#16352C;
    --status-warning:#E08A3E; --status-warning-soft:#3A2A18;
    --status-critical:#E2635C; --status-critical-soft:#3A1E1C;
    --status-info:#5FA8C9; --status-info-soft:#17303A;
    --status-neutral:#8CA0A6; --status-neutral-soft:#1E2C30;
    --stage-contract:#B9A6E8; --stage-contract-soft:#2A2340;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  button{font-family:inherit; color:inherit; cursor:pointer;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
  .shell{max-width:1280px; margin:0 auto; padding:12px clamp(16px,4vw,32px) 56px;}

  /* ---------- header (slim, no scroll bulk) ---------- */
  .topbar-slim{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    padding:9px 0 8px;
  }
  .brand-sm{display:flex; align-items:center; gap:7px; min-width:0;}
  .brand-mark-sm{width:18px; height:18px; flex:none; color:var(--accent);}
  .brand-sm h1{font-size:14px; font-weight:600; letter-spacing:.1px; white-space:nowrap;}
  .demo-tag-sm{
    font-size:9px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-muted);
    border:1px solid var(--border-strong); border-radius:999px; padding:1px 6px; flex:none;
  }
  .topbar-slim-right{display:flex; align-items:center; gap:8px; flex:none;}
  .pill-group{display:flex; gap:6px; background:var(--surface-alt); border-radius:999px; padding:4px; flex:none;}
  .pill-group.sm .pill-btn{padding:4px 9px; font-size:10.5px;}
  .pill-btn{
    border:none; background:transparent; color:var(--ink-secondary); font-size:12.5px; font-weight:500;
    padding:6px 12px; border-radius:999px; transition:background .15s,color .15s; white-space:nowrap;
  }
  .pill-btn.active{background:var(--accent); color:var(--accent-ink);}
  .lang-group .pill-btn{padding:5px 9px; font-family:var(--font-mono); font-size:10.5px; font-weight:600;}
  .cta-btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:var(--accent-ink);
    font-size:12px; font-weight:600; padding:7px 13px; border-radius:999px; text-decoration:none; white-space:nowrap;
  }
  .cta-btn:hover{filter:brightness(1.06);}
  .cta-btn svg{width:13px; height:13px; flex:none;}

  /* trust row */
  .trust-row{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:14px 0 4px;}
  .trust-badge{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:var(--ink-muted); border:1px solid var(--border); border-radius:999px; padding:5px 12px;}
  .trust-badge svg{width:13px; height:13px; flex:none;}

  /* section nav */
  .section-nav-row{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .section-nav{display:flex; gap:4px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:4px; background:var(--surface-alt); border-radius:999px; scrollbar-width:none; flex:1; min-width:0;}
  .section-nav::-webkit-scrollbar{display:none;}
  .section-tab{
    display:inline-flex; align-items:center; gap:7px; background:none; color:var(--ink-secondary); flex:none;
    border:none; font-size:13px; font-weight:600; padding:9px 16px; border-radius:999px; white-space:nowrap; cursor:pointer;
  }
  .section-tab svg{width:15px; height:15px; flex:none;}
  .section-tab:hover{color:var(--ink);}
  .section-tab.active{background:var(--accent); color:var(--accent-ink);}
  .section-nav-controls{flex:none;}

  /* donut chart */
  .donut-wrap{display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
  .donut-legend{display:flex; flex-direction:column; gap:8px; font-size:13px;}
  .donut-legend .row{display:flex; align-items:center; gap:8px;}
  .donut-legend .dot{width:10px; height:10px; border-radius:50%; flex:none;}
  .donut-legend .val{font-family:var(--font-mono); font-weight:600; margin-left:auto; padding-left:14px;}

  /* analytics charts */
  .northstar-value{font-family:var(--font-mono); font-size:clamp(32px,5vw,44px); font-weight:600; letter-spacing:-.01em;}
  .northstar-badge{display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:700; color:var(--status-good); background:var(--status-good-soft); border-radius:999px; padding:4px 12px; margin-left:10px;}
  .trend-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-top:6px;}
  .trend-card .trend-label{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); font-weight:600;}
  .trend-card .trend-value{font-family:var(--font-mono); font-size:20px; font-weight:600; margin:3px 0 8px;}
  .chart-legend{display:flex; gap:16px; margin-bottom:10px; font-size:12px; color:var(--ink-secondary);}
  .chart-legend span{display:inline-flex; align-items:center; gap:6px;}
  .chart-legend .sw{width:9px; height:9px; border-radius:2px; display:inline-block;}

  /* ---------- KPI ---------- */
  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; margin-bottom:20px;}
  .kpi-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:20px 22px; position:relative;
  }
  .kpi-label{font-size:12.5px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.06em; font-weight:500;}
  .kpi-value{font-family:var(--font-mono); font-size:clamp(28px,4vw,38px); font-weight:600; margin-top:6px; letter-spacing:-.01em;}
  .kpi-trend{display:inline-flex; align-items:center; gap:4px; font-size:12.5px; font-weight:600; margin-top:8px; color:var(--status-good);}
  .kpi-tile.alert{border-color:var(--status-critical); background:var(--status-critical-soft);}
  .kpi-tile.alert .kpi-value{color:var(--status-critical);}
  .kpi-tile.alert .kpi-label{color:var(--status-critical);}
  .kpi-tile.ok .kpi-value{color:var(--status-good);}
  .kpi-tile.clickable{cursor:pointer; text-align:left; width:100%; font-family:inherit;}
  .kpi-tile.clickable:hover{border-color:var(--border-strong);}
  .kpi-action{font-size:12px; font-weight:600; margin-top:8px; color:var(--ink-secondary); text-decoration:underline;}


  /* ---------- panels ---------- */
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:18px 20px; margin-bottom:16px;}
  .panel-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px;}
  .panel-title{font-size:15.5px; font-weight:600;}
  .panel-sub{font-size:12.5px; color:var(--ink-muted);}

  .panel-foot-stat{margin-top:12px; padding-top:12px; border-top:1px solid var(--border); font-size:13px; color:var(--ink-secondary); display:flex; justify-content:space-between;}

  /* sold yacht cleanup */
  .cleanup-row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:10px 0;}
  .cleanup-row + .cleanup-row{border-top:1px solid var(--border);}
  .cleanup-name{font-size:13.5px; font-weight:600;}
  .cleanup-meta{font-size:12px; color:var(--ink-muted); margin-top:3px;}
  .platform-chips{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .chip{font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600;}
  .chip.good{background:var(--status-good-soft); color:var(--status-good);}
  .chip.warning{background:var(--status-warning-soft); color:var(--status-warning);}
  .chip.critical{background:var(--status-critical-soft); color:var(--status-critical);}
  .fix-btn{font-size:12px; font-weight:600; border:1px solid var(--status-critical); color:var(--status-critical); background:transparent; padding:6px 12px; border-radius:var(--radius-sm); white-space:nowrap;}
  .fix-btn:hover{background:var(--status-critical-soft);}
  .empty-note{font-size:13px; color:var(--ink-muted); padding:6px 0;}

  /* funnel */
  .funnel-row{display:flex; gap:6px; margin-bottom:16px;}
  .funnel-step{flex:1; text-align:center; padding:12px 8px; border-radius:var(--radius-sm); background:var(--surface-alt); position:relative;}
  .funnel-step .n{font-family:var(--font-mono); font-size:20px; font-weight:600;}
  .funnel-step .l{font-size:11.5px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.04em; margin-top:2px;}
  .table-wrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border-strong); cursor:pointer; white-space:nowrap;}
  td{padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  td.name{font-weight:600; white-space:normal; min-width:150px;}
  @media (max-width:600px){ td.name{white-space:nowrap; min-width:0;} }

  /* deal pipeline */
  .kanban{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
  @media (max-width:900px){.kanban{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.kanban{grid-template-columns:1fr;}}
  @media (max-width:600px){.section-nav{justify-content:flex-start;} .section-tab{padding:8px 13px; font-size:12.5px;} .donut-wrap{gap:16px;} .section-nav-row{flex-wrap:wrap;} .section-nav-controls{width:100%; order:2;} .section-nav-controls .pill-group{width:100%; justify-content:flex-start; overflow-x:auto;}}
  .kanban-col{background:var(--surface-alt); border-radius:var(--radius-sm); padding:10px;}
  .kanban-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .kanban-head .t{font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-secondary);}
  .kanban-head .c{font-family:var(--font-mono); font-size:13px; font-weight:600;}
  .deal-chip{background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:11.5px; margin-bottom:6px;}
  .deal-chip b{display:block; font-size:12px;}
  .followup-badge{margin-top:6px; font-size:12.5px; color:var(--status-warning); font-weight:600;}
  .kanban-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px;}
  .stage-pill{font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px; display:inline-block; white-space:nowrap;}
  .listing-link{background:none; border:none; padding:0; text-align:left; font-family:inherit; font-weight:600; color:var(--ink); cursor:pointer; text-decoration:underline; text-decoration-color:var(--border-strong); text-underline-offset:2px;}
  .listing-link:hover{color:var(--accent); text-decoration-color:var(--accent);}

  /* churn prediction: methodology flow + clickable qualified-by-channel bars */
  .method-flow{display:flex; flex-wrap:wrap; align-items:stretch; gap:10px;}
  .method-step{flex:1; min-width:150px; background:var(--surface-alt); border-radius:var(--radius-sm); padding:14px 14px 16px;}
  .method-step .num{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-family:var(--font-mono); font-size:11.5px; font-weight:700; margin-bottom:8px;}
  .method-step .st{font-size:13px; font-weight:600; margin-bottom:4px;}
  .method-step .sd{font-size:12px; color:var(--ink-secondary); line-height:1.5;}
  .method-arrow{display:flex; align-items:center; color:var(--ink-muted); font-size:16px; flex:none;}
  @media (max-width:760px){.method-arrow{display:none;} .method-flow{gap:8px;}}
  .qualified-row{display:grid; grid-template-columns:1.3fr 2fr auto 16px; gap:12px; align-items:center; width:100%; background:none; border:1px solid transparent; padding:9px 8px; border-radius:var(--radius-sm); text-align:left; font-family:inherit; cursor:pointer;}
  .qualified-row:hover{background:var(--surface-alt); border-color:var(--border);}
  .qualified-row+.qualified-row{border-top:1px solid var(--border);}
  .qualified-label{font-size:13px; font-weight:600;}
  .qualified-bar-track{height:8px; border-radius:5px; background:var(--surface-alt); overflow:hidden;}
  .qualified-bar-fill{display:block; height:100%; border-radius:5px;}
  .qualified-value{font-size:13px;}
  @media (max-width:600px){.qualified-row{grid-template-columns:1fr auto 16px;} .qualified-bar-track{display:none;}}

  /* channel panel */
  .channel-row{
    display:grid; grid-template-columns:1.6fr .9fr .9fr 1.4fr 20px; gap:14px; align-items:center;
    padding:14px 10px; border-radius:var(--radius-sm); cursor:pointer; text-align:left; width:100%; background:none; border:1px solid transparent;
  }
  .channel-row:hover{background:var(--surface-alt); border-color:var(--border);}
  .channel-row + .channel-row{border-top:1px solid var(--border);}
  @media (max-width:760px){.channel-row{grid-template-columns:1fr; gap:8px;} .channel-row .chev{display:none;}}
  .channel-name{display:flex; align-items:center; gap:10px; font-weight:600; font-size:14px;}
  .channel-ico{width:30px; height:30px; flex:none; border-radius:8px; background:color-mix(in srgb, var(--c, var(--accent)) 16%, var(--surface)); color:var(--c, var(--accent)); display:flex; align-items:center; justify-content:center;}
  .channel-ico.ig{background:linear-gradient(135deg,#FED373 0%,#F65678 42%,#C13584 70%,#5851DB 100%); color:#fff;}
  .channel-count{font-family:var(--font-mono); font-size:15px;}
  .channel-count .u{display:block; font-size:11px; color:var(--ink-muted); font-family:var(--font-body);}
  .split-bar{height:8px; border-radius:5px; overflow:hidden; display:flex; background:var(--surface-alt);}
  .split-legend{display:flex; gap:10px; margin-top:5px; font-size:11px; color:var(--ink-muted);}
  .split-legend span{display:inline-flex; align-items:center; gap:4px;}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block;}
  .chev{color:var(--ink-muted);}

  /* detail views */
  .back-btn{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--ink-secondary); background:none; border:none; padding:0 0 14px; }
  .back-btn:hover{color:var(--ink);}
  .thread-list-item{display:flex; gap:12px; align-items:flex-start; justify-content:space-between; padding:14px 4px; cursor:pointer; border-radius:var(--radius-sm);}
  .thread-list-item:hover{background:var(--surface-alt);}
  .thread-list-item + .thread-list-item{border-top:1px solid var(--border);}
  .tli-buyer{font-weight:600; font-size:14px;}
  .tli-meta{font-size:12.5px; color:var(--ink-muted); margin-top:2px;}
  .tli-preview{font-size:13px; color:var(--ink-secondary); margin-top:5px; max-width:520px;}
  .status-pill{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .status-pill.closed{background:var(--status-good-soft); color:var(--status-good);}
  .status-pill.still_interested{background:var(--status-info-soft); color:var(--status-info);}
  .status-pill.churned{background:var(--status-neutral-soft); color:var(--status-neutral);}
  .status-pill.pending{background:var(--status-warning-soft); color:var(--status-warning);}

  .msg-log{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
  .msg{max-width:74%; padding:10px 13px; border-radius:12px; font-size:13.5px; line-height:1.45;}
  .msg.buyer{align-self:flex-start; background:var(--surface-alt); border-bottom-left-radius:3px;}
  .msg.broker{align-self:flex-end; background:var(--accent-soft); color:var(--ink); border-bottom-right-radius:3px;}
  .msg .t{display:block; font-size:10.5px; color:var(--ink-muted); margin-top:5px;}
  .draft-box{border:1px dashed var(--border-strong); border-radius:var(--radius-md); padding:14px 16px; background:var(--surface-alt);}
  .draft-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  textarea{width:100%; min-height:88px; resize:vertical; border:1px solid var(--border-strong); border-radius:var(--radius-sm); padding:10px 12px; font-family:var(--font-body); font-size:13.5px; background:var(--surface); color:var(--ink);}
  .draft-actions{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;}
  .btn{border-radius:var(--radius-sm); padding:9px 16px; font-size:13px; font-weight:600; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink);}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn.text{border-color:transparent; color:var(--ink-secondary); text-decoration:underline;}
  .sent-note{font-size:12.5px; color:var(--status-good); font-weight:600; display:flex; align-items:center; gap:6px;}
  .visitor-row{display:grid; grid-template-columns:1.5fr .7fr .7fr 1.2fr 1.3fr; gap:12px; align-items:center; padding:12px 4px; font-size:13px; text-align:left;}
  .visitor-row + .visitor-row{border-top:1px solid var(--border);}
  .visitor-row.head{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); font-weight:600;}
  button.visitor-row-link{width:100%; background:none; border:none; position:relative; padding-right:26px; cursor:pointer; border-radius:var(--radius-sm);}
  button.visitor-row-link:hover{background:var(--surface-alt);}
  .visitor-chev{position:absolute; right:6px; top:50%; transform:translateY(-50%);}
  @media (max-width:760px){
    .visitor-row{grid-template-columns:1fr; gap:2px; padding:12px 0;}
    .visitor-row.head{display:none;}
    button.visitor-row-link{padding-right:4px;}
    .visitor-chev{display:none;}
  }
  .conf{font-family:var(--font-mono);}
  .conf.high{color:var(--status-good);} .conf.med{color:var(--status-warning);} .conf.low{color:var(--status-neutral);}
  .us-only-tag{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-muted); border:1px solid var(--border-strong); border-radius:999px; padding:1px 7px; margin-left:6px; font-weight:700; vertical-align:middle; white-space:nowrap;}
  .research-field{margin:0 0 14px;}
  .research-field .fl{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); font-weight:600; margin-bottom:3px;}
  .research-field .fv{font-size:14px; color:var(--ink); line-height:1.5;}
  .research-field .fv.muted{color:var(--ink-muted); font-style:italic;}

  /* channel intro (AI SDR / Deanonymization explainers) */

function loadLang(){ try{ const v = localStorage.getItem('binnacle_lang'); return (v && UI[v]!==undefined) ? v : 'en'; }catch(e){ return 'en'; } }
function saveLang(l){ try{ localStorage.setItem('binnacle_lang', l); }catch(e){} }

let state = {range:'month', lang:loadLang(), view:'dashboard', section:'overview', channelId:null, threadId:null, listingId:null, visitorIndex:null, repId:null, sortCol:'inquiries', sortDir:'desc',
  cleanupFixed:{}, sentMessages:{}};

  {id:'overview', icon:'grid', labelKey:'secOverview'},

function scale(n){return Math.round(n * RANGE_FACTOR[state.range]);}

/* ============================= CHROME (header/footer, redrawn on language change) ============================= */
function applyChrome(){
  document.documentElement.lang = state.lang;
  document.getElementById('demoTag').textContent = t('sampleTag');
  document.getElementById('footerNote').innerHTML = t('footerNote');
  document.getElementById('ctaTopText').textContent = t('bookCall');
  document.getElementById('trustGdprText').textContent = t('trustGdpr');
  document.getElementById('trustSocText').textContent = t('trustSoc');
  document.getElementById('backToSiteText').textContent = t('backToSite');
  document.getElementById('langGroup').setAttribute('aria-label', t('languageAria'));
  document.querySelectorAll('[data-lang]').forEach(b=>{ b.classList.toggle('active', b.dataset.lang===state.lang); });
}

/* ============================= RENDER ============================= */
function renderApp(){
  const app = document.getElementById('app');
  if(state.view==='dashboard'){ app.innerHTML = dashboardHTML(); bindDashboard(); }
  else if(state.view==='channel'){ app.innerHTML = channelViewHTML(state.channelId); bindChannelView(); }
  else if(state.view==='thread'){ app.innerHTML = threadViewHTML(state.channelId, state.threadId); bindThreadView(); }
  else if(state.view==='listing'){ app.innerHTML = listingViewHTML(state.listingId); bindListingView(); }
  else if(state.view==='visitor'){ app.innerHTML = visitorViewHTML(state.visitorIndex); bindThreadView(); }
  else if(state.view==='rep'){ app.innerHTML = repViewHTML(state.repId); bindListingView(); }
}
function navigate(fn){ fn(); window.scrollTo({top:0}); renderApp(); }

  const rangeText = {month:t('rangeMonth'), '30d':t('range30'), quarter:t('rangeQuarter')};

      <button class="section-tab ${state.section===s.id?'active':''}" data-section="${s.id}" role="tab" aria-selected="${state.section===s.id}">

      </button>`).join('')}</div>

      <div class="pill-group sm" role="tablist" aria-label="${t('dateRangeAria')}">

  </div>`;
}

function cleanupRow(listing, daysAgo, fixed){

}

/* ============================= CHART HELPERS (inline SVG, theme-token colored) ============================= */
function trendChartSVG(values, opts){
  const o = Object.assign({w:520, h:100, color:'var(--accent)', fill:true, labels:[], fmt:(v)=>v}, opts||{});
  const max = Math.max(...values) * 1.15, min = Math.min(0, Math.min(...values) * 0.9);
  const span = (max-min) || 1;
  const stepX = o.w/(values.length-1 || 1);
  const y = v => o.h - ((v-min)/span)*o.h;
  const pts = values.map((v,i)=>[i*stepX, y(v)]);
  const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaPath = `${path} L${o.w},${o.h} L0,${o.h} Z`;
  const last = pts[pts.length-1];
  const labelsRow = o.labels.length ? `<div style="display:flex; justify-content:space-between; margin-top:4px;">${o.labels.map(l=>`<span style="font-size:10.5px; color:var(--ink-muted)">${l}</span>`).join('')}</div>` : '';
  return `<div>
    <svg viewBox="0 0 ${o.w} ${o.h+14}" width="100%" style="overflow:visible; display:block;">
      ${o.fill?`<path d="${areaPath}" fill="${o.color}" opacity=".12"/>`:''}
      <path d="${path}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${o.color}" stroke="var(--surface)" stroke-width="2"/>
    </svg>
    ${labelsRow}
  </div>`;
}

function hBarChartSVG(items, opts){
  const o = Object.assign({w:600, barH:22, gap:14, labelW:150, labelSize:12.5}, opts||{});
  const max = Math.max(...items.map(i=>i.value)) * 1.08 || 1;
  const h = items.length*(o.barH+o.gap) - o.gap;
  const chartW = o.w-o.labelW-46;
  const rows = items.map((it,i)=>{
    const yy = i*(o.barH+o.gap);
    const bw = Math.max((it.value/max)*chartW, 3);
    return `
      <text x="0" y="${yy+o.barH*0.68}" font-size="${o.labelSize}" fill="var(--ink-secondary)">${it.label}</text>
      <rect x="${o.labelW}" y="${yy}" width="${chartW}" height="${o.barH}" rx="5" fill="var(--surface-alt)"/>
      <rect x="${o.labelW}" y="${yy}" width="${bw}" height="${o.barH}" rx="5" fill="${it.color}"/>
      <text x="${o.labelW+bw+8}" y="${yy+o.barH*0.68}" font-size="12" font-family="var(--font-mono)" fill="var(--ink)">${it.value}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${o.w} ${h}" width="100%">${rows}</svg>`;
}

function groupedBarSVG(categories, seriesPrev, seriesCurr, opts){
  const o = Object.assign({w:600, h:180}, opts||{});
  const max = Math.max(...seriesCurr, ...seriesPrev) * 1.2 || 1;
  const groupW = o.w/categories.length;
  const barW = Math.min(groupW*0.26, 30);
  const baseline = o.h-22;
  const bars = categories.map((cat,i)=>{
    const cx = i*groupW + groupW/2;
    const hPrev = (seriesPrev[i]/max)*(baseline-14);
    const hCurr = (seriesCurr[i]/max)*(baseline-14);
    return `
      <rect x="${(cx-barW-4).toFixed(1)}" y="${(baseline-hPrev).toFixed(1)}" width="${barW}" height="${hPrev.toFixed(1)}" rx="3" fill="var(--ink-muted)" opacity=".55"/>
      <rect x="${(cx+4).toFixed(1)}" y="${(baseline-hCurr).toFixed(1)}" width="${barW}" height="${hCurr.toFixed(1)}" rx="3" fill="var(--accent)"/>
      <text x="${(cx-barW-4+barW/2).toFixed(1)}" y="${(baseline-hPrev-6).toFixed(1)}" font-size="10" font-family="var(--font-mono)" fill="var(--ink-muted)" text-anchor="middle">${seriesPrev[i]}</text>
      <text x="${(cx+4+barW/2).toFixed(1)}" y="${(baseline-hCurr-6).toFixed(1)}" font-size="10.5" font-weight="700" font-family="var(--font-mono)" fill="var(--ink)" text-anchor="middle">${seriesCurr[i]}</text>
      <text x="${cx.toFixed(1)}" y="${baseline+16}" font-size="11.5" fill="var(--ink-secondary)" text-anchor="middle">${cat}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${o.w} ${o.h}" width="100%">
    <line x1="0" y1="${baseline}" x2="${o.w}" y2="${baseline}" stroke="var(--border-strong)" stroke-width="1"/>
    ${bars}
  </svg>`;
}

function donutChartSVG(items, opts){
  const o = Object.assign({size:150, thickness:20, centerLabel:'', centerValue:''}, opts||{});
  const total = items.reduce((s,it)=>s+it.value, 0) || 1;
  const r = o.size/2 - o.thickness/2;
  const c = o.size/2;
  const circumference = 2*Math.PI*r;
  let offset = 0;
  const segs = items.filter(it=>it.value>0).map(it=>{
    const frac = it.value/total;
    const dash = frac*circumference;
    const seg = `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${it.color}" stroke-width="${o.thickness}"
      stroke-dasharray="${dash.toFixed(2)} ${(circumference-dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"
      transform="rotate(-90 ${c} ${c})"/>`;
    offset += dash;
    return seg;
  }).join('');
  const legend = items.map(it=>`
    <div class="row"><span class="dot" style="background:${it.color}"></span><span>${it.label}</span><span class="val">${it.value}</span></div>`).join('');
  return `<div class="donut-wrap">
    <svg viewBox="0 0 ${o.size} ${o.size}" width="${o.size}" height="${o.size}">
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--surface-alt)" stroke-width="${o.thickness}"/>
      ${segs}
      <text x="${c}" y="${c-4}" text-anchor="middle" font-family="var(--font-mono)" font-size="19" font-weight="600" fill="var(--ink)">${o.centerValue}</text>
      <text x="${c}" y="${c+13}" text-anchor="middle" font-size="10" letter-spacing=".04em" fill="var(--ink-muted)">${(o.centerLabel||'').toUpperCase()}</text>
    </svg>
    <div class="donut-legend">${legend}</div>
  </div>`;
}

}
function bindDashboard(){
  document.querySelectorAll('[data-section]').forEach(el=>el.addEventListener('click', ()=>{
    if(el.dataset.section===state.section) return;
    navigate(()=>{ state.section=el.dataset.section; });
  }));
  document.querySelectorAll('[data-range]').forEach(el=>el.addEventListener('click', ()=>{
    if(el.dataset.range===state.range) return;
    state.range=el.dataset.range; renderApp();
  }));
  document.querySelectorAll('[data-channel]').forEach(el=>el.addEventListener('click', ()=>{
    navigate(()=>{ state.view='channel'; state.channelId=el.dataset.channel; });
  }));
  document.querySelectorAll('[data-listing]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    navigate(()=>{ state.view='listing'; state.listingId=el.dataset.listing; });
  }));
  document.querySelectorAll('[data-rep]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    navigate(()=>{ state.view='rep'; state.repId=el.dataset.rep; });
  }));
  document.querySelectorAll('[data-fix]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    state.cleanupFixed[el.dataset.fix]=true; renderApp();
  }));
  document.querySelectorAll('[data-scrollto]').forEach(el=>el.addEventListener('click', ()=>{
    const targetSection = el.dataset.scrolltoSection;
    if(targetSection && targetSection!==state.section){
      navigate(()=>{ state.section=targetSection; });
      requestAnimationFrame(()=>document.getElementById(el.dataset.scrollto)?.scrollIntoView({behavior:'smooth', block:'start'}));
    } else {
      document.getElementById(el.dataset.scrollto)?.scrollIntoView({behavior:'smooth', block:'start'});
    }
  }));
  document.querySelectorAll('th[data-sort]').forEach(el=>el.addEventListener('click', ()=>{
    const col=el.dataset.sort;
    if(state.sortCol===col) state.sortDir = state.sortDir==='asc'?'desc':'asc';
    else {state.sortCol=col; state.sortDir='desc';}
    renderApp();
  }));
}
function bindChannelView(){
  document.querySelectorAll('[data-back]').forEach(el=>el.addEventListener('click', ()=>{ navigate(()=>{ state.view='dashboard'; }); }));
  document.querySelectorAll('[data-thread]').forEach(el=>el.addEventListener('click', ()=>{
    navigate(()=>{ state.view='thread'; state.threadId=el.dataset.thread; });
  }));
  document.querySelectorAll('[data-visitor]').forEach(el=>el.addEventListener('click', ()=>{
    navigate(()=>{ state.view='visitor'; state.visitorIndex=el.dataset.visitor; });
  }));
}
function bindThreadView(){
  document.querySelectorAll('[data-back]').forEach(el=>el.addEventListener('click', ()=>{ navigate(()=>{ state.view=el.dataset.back; }); }));
  const sendBtn = document.querySelector('[data-send]');
  if(sendBtn) sendBtn.addEventListener('click', ()=>{
    const text = document.getElementById('draftText').value.trim();
    if(!text) return;
    state.sentMessages[sendBtn.dataset.send] = text;
    renderApp();
  });
  const writeOwn = document.querySelector('[data-writeown]');
  if(writeOwn) writeOwn.addEventListener('click', ()=>{
    document.getElementById('draftText').value='';
    document.getElementById('draftText').focus();
  });
}

/* ============================= INIT ============================= */
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click', ()=>{
  state.lang=b.dataset.lang; saveLang(state.lang); applyChrome(); renderApp();
}));

applyChrome();
renderApp();
</script>
